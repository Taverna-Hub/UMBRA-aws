services:
  mysqldb:
    image: mysql:8.0-oracle
    container_name: mysql-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ordemdb}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    command: >
      --default-authentication-plugin=mysql_native_password
      --innodb-buffer-pool-size=128M
      --max-connections=30
    volumes:
      - mysql_data:/var/lib/mysql
      - ../../sql-scripts/ordemdb.sql:/docker-entrypoint-initdb.d/01-ordemdb.sql:ro
      - ../../sql-scripts/population.sql:/docker-entrypoint-initdb.d/02-population.sql:ro
    networks:
      - app-network

  backend:
    build: .
    container_name: springboot-api
    restart: always
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysqldb:3306/${MYSQL_DATABASE:-ordemdb}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      DB_URL: jdbc:mysql://mysqldb:3306/${MYSQL_DATABASE:-ordemdb}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
    depends_on:
      - mysqldb
    networks:
      - app-network

volumes:
  mysql_data:

networks:
  app-network:
    driver: bridge
