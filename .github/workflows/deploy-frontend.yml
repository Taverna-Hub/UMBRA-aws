name: Deploy Frontend ReactTS (EC2)

on:
  push:
    branches: [ "main" ]
    paths:
      - 'ordem-front/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./ordem-front

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: ordem-front/package-lock.json

      - name: Instalar Dependências e Gerar Build
        env:
          VITE_API_URL: http://${{ secrets.EC2_HOST }}:8080
          VITE_MAPTILER_API_KEY: ${{ secrets.VITE_MAPTILER_API_KEY }}
        run: |
          npm ci
          npm run build

      - name: Enviar Build para a EC2 via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "ordem-front/dist/*"
          target: "/var/www/html"
          strip_components: 2
